<form [formGroup]="addressForm">
  <mat-form-field>
    <mat-label>Line 1</mat-label>
    <input matInput type="text" name="line1" formControlName="line1" (change)="sendUpdate()">
  </mat-form-field>
  <mat-form-field>
    <mat-label>Line 2</mat-label>
    <input matInput type="text" name="line2" formControlName="line2" (change)="sendUpdate()">
  </mat-form-field>
  <mat-form-field>
    <mat-label>City</mat-label>
    <input matInput type="text" name="city" formControlName="city" (change)="sendUpdate()">
  </mat-form-field>
  <div id="combo">
    <mat-form-field id="state">
      <mat-label>State</mat-label>
      <input matInput type="text" name="state" formControlName="state" (change)="sendUpdate()">
    </mat-form-field>
    <mat-form-field>
      <mat-label>Zip</mat-label>
      <input matInput type="text" name="zip" formControlName="zip" (change)="sendUpdate()">
    </mat-form-field>
  </div>
</form>
