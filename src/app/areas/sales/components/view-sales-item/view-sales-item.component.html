<mat-card >
  <mat-card-header>
    <mat-card-title>
      <h1>Create New Sales Item</h1>
    </mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form class="flexContainer">
      <mat-form-field appearance="outline">
        <mat-label class="label">Name</mat-label>
        <input matInput id="name" type="text" name="name" [(ngModel)]="itemInput.name" required>
        <mat-error class="label">A name is required</mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label class="label">Description</mat-label>
        <input matInput id="desc" type="textarea" name="desc" [(ngModel)]="itemInput.description">
        <mat-error class="label">Line 1 is required</mat-error>
      </mat-form-field>
    </form>
    <h4>Items</h4>
    @for (item of itemInput.inventoryItems; track item) {
      <div>
        <div class="itemContainer">
          <input #quantity class="quantity" type="number" class="form-control" min="1" [(ngModel)]="item.quantity" required/>
          <mat-expansion-panel hideToggle disabled cdkDrag cdkDropList class="itemRow" >
            <mat-expansion-panel-header>
              <mat-panel-title>
                <span id="id">{{ item.inventoryItem?.assetId }}</span>
              </mat-panel-title>
              <mat-panel-description>
                <span id="name">{{ item.inventoryItem?.name }}</span>
                <span id="price">{{ item.inventoryItem!.dailyRentalRate * item.quantity | currencyFormatter }}</span>
              </mat-panel-description>
            </mat-expansion-panel-header>
          </mat-expansion-panel>
          <mat-icon class="closeButton" fontIcon="close" color="warn" (click)="removeItem(item.inventoryItem!.id)"></mat-icon>
        </div>
      </div>
    }
  </mat-card-content>
  <mat-card-actions>
    <button mat-raised-button color="warn" (click)="resetItem()">Reset</button>
    <button mat-raised-button color="primary" (click)="addOrUpdateItem()">Save</button>
  </mat-card-actions>
</mat-card>
