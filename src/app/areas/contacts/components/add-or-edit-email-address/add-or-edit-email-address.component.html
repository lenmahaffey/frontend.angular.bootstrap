
<h1 mat-dialog-title>Add New Email Address</h1>
<form [formGroup]="addressFormGroup" (ngSubmit)="onSubmit(this.addressFormGroup)">
  <div mat-dialog-content>
      <div class="topRow">
        <mat-form-field appearance="outline">
          <mat-label>Label</mat-label>
          <input matInput type="text" formControlName="label">
        </mat-form-field>
        <div *ngIf="labelInput.invalid && (labelInput.dirty || labelInput.touched)" class="alert">
          <div *ngIf="labelInput.errors?.['required']">A label is required.</div>
          <div *ngIf="labelInput.errors?.['maxlength']">
            The label must be 10 characters or less.
          </div>
        </div>
      </div>
      <div >
        <mat-form-field appearance="outline">
          <mat-label>Address</mat-label>
          <input matInput formControlName="address" type="email" name="number">
        </mat-form-field>
        <div *ngIf="addressInput.invalid && (addressInput.dirty || addressInput.touched)" class="alert">
          <div *ngIf="addressInput.errors?.['required']">An email address is required.</div>
          <div *ngIf="addressInput.errors?.['email']">
            Please provide an email address in the format of username@domain
          </div>
        </div>
      </div>
  </div>
  <div mat-dialog-actions>
    <button mat-raised-button color="primary" (click)="onSubmit(undefined)" type="button" >Cancel</button>
    <button mat-raised-button color="warn" [disabled]="addressInput.invalid" type="submit">Save</button>
  </div>
</form>
