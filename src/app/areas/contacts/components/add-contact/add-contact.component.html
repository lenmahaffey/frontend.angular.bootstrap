<div mat-dialog-title>{{title}}</div>
<form [formGroup]="contactFormGroup">
  <mat-checkbox formControlName="isBusiness">Is a Business</mat-checkbox>
  <mat-dialog-content>
    <div *ngIf="contactFormGroup.value.isBusiness">
      <div class="flexColumn">
        <mat-form-field class="padding flexItem" appearance="outline">
          <mat-label class="label">Business Name</mat-label>
          <input matInput id="businessName" type="text" name="businessName" formControlName="businessName">
        </mat-form-field>
        <mat-form-field class="padding flexItem" appearance="outline">
          <mat-label class="label">Business Type</mat-label>
          <mat-select>
            <mat-option [value]="'customer'">Customer</mat-option>
            <mat-option [value]="'competitor'">Competitor</mat-option>
            <mat-option [value]="'manufacturer'">Manufacturer</mat-option>
            <mat-option [value]="'vendor'">Vendor</mat-option>
            <mat-option [value]="'venue'">Venue</mat-option>
          </mat-select>
          <!-- <input matInput id="businessName" type="text" name="businessName" formControlName="businessName"> -->
        </mat-form-field>
      </div>
    </div>
    <div *ngIf="!contactFormGroup.value.isBusiness">
      <mat-form-field class="padding flexItem" appearance="outline">
        <mat-label class="label">Contact Type</mat-label>
        <mat-select>
          <mat-option [value]="'customer'">User</mat-option>
          <mat-option [value]="'competitor'">Employee</mat-option>
          <mat-option [value]="'manufacturer'">Freelancer</mat-option>
          <mat-option [value]="'none'">None</mat-option>
        </mat-select>
      </mat-form-field>
      <div class="flexRow">
        <mat-form-field class="padding flexItem" appearance="outline">
          <mat-label class="label">Prefix</mat-label>
          <input matInput id="prefix" type="text" name="prefix" formControlName="prefix">
        </mat-form-field>
        <mat-form-field class="padding flexItem" appearance="outline">
          <mat-label class="label">First Name</mat-label>
          <input matInput id="firstName" type="text" name="firstName" formControlName="firstName" required>
        </mat-form-field>
        <mat-form-field class="padding flexItem" appearance="outline">
          <mat-label class="label">Middle Name</mat-label>
          <input matInput id="middleName" type="text" name="middleName" formControlName="middleName">
        </mat-form-field>
        <mat-form-field class="padding flexItem" appearance="outline">
          <mat-label class="label">Last Name</mat-label>
          <input matInput id="lastName" type="text" name="lastName" formControlName="lastName" required>
        </mat-form-field>
        <mat-form-field class="flexItem" appearance="outline">
          <mat-label class="label">Suffix</mat-label>
          <input matInput id="suffix" type="text" name="suffix" formControlName="suffix">
        </mat-form-field>
      </div>
      <div class="flexRow">
        <mat-form-field class="padding flexItem" appearance="outline">
          <mat-label class="label">Title</mat-label>
          <input matInput id="title" type="text" name="title" formControlName="title">
        </mat-form-field>
        <mat-form-field class="padding flexItem" appearance="outline">
          <mat-label class="label">Preferrerd Name</mat-label>
          <input matInput id="preferredName" type="text" name="preferredName" formControlName="preferredName">
        </mat-form-field>
      </div>
    </div>
    <div class="flexRow">
      <mat-form-field class="flexItem" appearance="outline">
        <mat-label>Add a comment</mat-label>
        <textarea matInput></textarea>
      </mat-form-field>
    </div>
  </mat-dialog-content>
  <div mat-dialog-actions>
    <button mat-raised-button color="accent" (click)="closeModal()">Cancel</button>
    <button mat-raised-button color="primary"(click)="submit()">Ok</button>
  </div>
</form>
