<div *ngIf="(this.contact != undefined)" class="page flexColumn h-100">
  <div class="main flexRow">
    <mat-card class="flexItem">
      <mat-card-content class="fullHeight">
        <div class="flexRow">
          <img class="image" src="../../../../assets/No-Image-Placeholder.svg">
          <div class="flexColumn flexItem">
            <h1 class="autoMargin flexItem">{{ this.contact.businessName }}{{this.contact.firstName}} {{this.contact.lastName}}</h1>
            <h3 class="autoMargin flexItem">{{ this.contact.title != null ? this.contact.title : "none" }}</h3>
          </div>
        </div>
        <mat-tab-group class="fullHeight flexRow">
          <mat-tab label="Phone Numbers">
            <div class="hideOverflow flexColumn phoneNumberList">
              <div
                *ngIf="this.contact.contactInformation != null && this.contact.contactInformation.phoneNumbers != null">
                <mat-list cdkDropList [cdkDropListData]="this.contact.contactInformation.phoneNumbers">
                  <mat-list-item class="phoneNumberListItem flexItem" cdkDrag cdkDragLockAxis="y"
                    *ngFor="let number of this.contact.contactInformation.phoneNumbers; index as i">
                    <div class="phoneNumberContainer">
                      <div class="phoneNumber flexItem">{{number.label}} : {{number | phoneNumberToString}}</div>
                      <div class="edit" (click)="openAddPhoneNumberModal(number)"><i class="fa-solid fa-pen fa-xl"></i>
                      </div>
                      <div class="delete" (click)="openDeletePhoneNumberModal(number)"><i
                          class="fa-solid fa-xmark fa-2xl"></i></div>
                    </div>
                  </mat-list-item>
                </mat-list>
              </div>
              <div class="flexItem flexColumn">
                <div class="flexItem autoMargin">
                  <button mat-raised-button color="primary" (click)="openAddPhoneNumberModal(undefined)">
                    Add New Number
                  </button>
                </div>
              </div>
            </div>
          </mat-tab>
          <mat-tab label="Addresses">
            <mat-tab-group>
              <mat-tab label="Mailing">
                <div class="addressContainer">
                  <div class="address">
                    <app-address-form [address]="currentMailingAddress" (addressChange)="onAddressReceived($event)" (delete)="deletePhysicalAddress($event)"></app-address-form>
                  </div>
                </div>
              </mat-tab>
              <mat-tab label="Billing">
                <div class="addressContainer">
                  <div class="address">
                    <app-address-form [address]="currentBillingAddress" (addressChange)="onAddressReceived($event)" (delete)="deletePhysicalAddress($event)"></app-address-form>
                  </div>
                </div>
              </mat-tab>
              <mat-tab label="Shipping">
                <div class="addressContainer">
                  <div class="address">
                    <app-address-form [address]="currentShippingAddress" (addressChange)="onAddressReceived($event)" (delete)="deletePhysicalAddress($event)"></app-address-form>
                  </div>
                </div>
              </mat-tab>
            </mat-tab-group>
          </mat-tab>
          <mat-tab label="Email">
            <div class="hideOverflow flexColumn phoneNumberList">
              <div class="phoneNumberList flexItem"
                *ngIf="this.contact.contactInformation != null && this.contact.contactInformation.emailAddresses != null">
                <mat-list cdkDropList [cdkDropListData]="this.contact.contactInformation.phoneNumbers">
                  <mat-list-item class="phoneNumberListItem flexItem" cdkDrag cdkDragLockAxis="y"
                    *ngFor="let email of this.contact.contactInformation.emailAddresses; index as i">
                    <div class="phoneNumberContainer">
                      <div class="phoneNumber flexItem">{{email.address}}</div>
                      <div class="edit" (click)="openAddEmailAddressModal(email)"><i class="fa-solid fa-pen fa-xl"></i></div>
                      <div class="delete" (click)="openDeleteEmailAddressModal(email)"><i class="fa-solid fa-xmark fa-2xl"></i></div>
                    </div>
                  </mat-list-item>
                </mat-list>
              </div>
              <div class="flexItem flexColumn">
                <div class="flexItem autoMargin">
                  <button mat-raised-button color="primary" (click)="openAddEmailAddressModal(undefined)">Add New Email Address</button>
                </div>
              </div>
            </div>
          </mat-tab>
        </mat-tab-group>
      </mat-card-content>
    </mat-card>
    <!-- <mat-card class="rightCard flexItem hideOverflow">
      <mat-card-content>
        <div class="flexColumn"><img class="image" src="../../../../assets/No-Image-Placeholder.svg"></div>
      </mat-card-content>
    </mat-card> -->
  </div>
</div>
