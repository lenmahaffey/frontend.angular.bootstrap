<div class="page flexRow" cdkDropListGroup>
  <app-list-contacts [contactList]="contactList" [cdkDropListData]="contactList" cdkDropList (contact)="onContactSelected($event)"></app-list-contacts>
  <div class="info flexColumn">
    <div class="details">
        <app-view-contact *ngIf="selectedContact != undefined" [contactInput]="selectedContact"></app-view-contact>
    </div>
  </div>
</div>
