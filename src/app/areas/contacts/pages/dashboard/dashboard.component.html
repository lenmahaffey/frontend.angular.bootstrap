<div class="page flexRow">
  <app-list-contacts [data]="data" (contact)="onContactSelected($event)"></app-list-contacts>
  <div class="info flexColumn">
    <div class="details">
        <app-view-contact *ngIf="contact != undefined" [contactId]="contact.id"></app-view-contact>
    </div>
  </div>

</div>
