<div class="page flexRow">
  <div class="contacts flexRow">
    <div class="list flexItem">
      <form [formGroup]="searchFormGroup">
        <div class="flexRow searchInputs">
          <mat-form-field class="input" appearance="outline">
            <mat-label class="label">First Name</mat-label>
            <input matInput id="line1" type="text" name="firstName" formControlName="firstName" (keyup)="searchContacts()">
          </mat-form-field>
          <mat-form-field class="input" appearance="outline">
            <mat-label class="label">Last Name</mat-label>
            <input matInput id="line1" type="text" name="lastName" formControlName="lastName" (keyup)="searchContacts()">
          </mat-form-field>
        </div>
     </form>
      <div class="buttons">
        <button mat-raised-button [matMenuTriggerFor]="filterMenu" color="primary">Filter</button>
        <mat-menu #filterMenu="matMenu">
          <form [formGroup]="filterOptions">
            <div class="flexRow selection" (click)="$event.stopPropagation();filterContacts()">
              <mat-checkbox formControlName="employees" [value]="filterOptions.value.employees"></mat-checkbox>
              <div mat-menu-item><span class="badge bg-primary" >Employee</span></div>
            </div>
            <div class="flexRow selection" (click)="$event.stopPropagation();filterContacts()">
              <mat-checkbox formControlName="freelancers" [value]="filterOptions.value.freelancers"></mat-checkbox>
              <div mat-menu-item><span class="badge bg-warning">Freelancer</span></div>
            </div>
            <div class="flexRow selection" (click)="$event.stopPropagation();filterContacts()">
              <mat-checkbox formControlName="customers" [value]="filterOptions.value.customers"></mat-checkbox>
              <div mat-menu-item><span class="badge bg-success">Customer</span></div>
            </div>
            <div class="flexRow selection" (click)="$event.stopPropagation();filterContacts()">
              <mat-checkbox formControlName="users" [value]="filterOptions.value.users"></mat-checkbox>
              <div mat-menu-item><span class="badge bg-danger">User</span></div>
            </div>
          </form>
        </mat-menu>
        <button mat-raised-button [matMenuTriggerFor]="sortMenu" color="primary">Sort</button>
        <mat-menu #sortMenu="matMenu">
          <mat-radio-group [(ngModel)]="sortOptions" (change)="sortContacts()">
            <div class="flexRow selection" >
              <mat-radio-button [value]="'firstName'"></mat-radio-button>
              <div mat-menu-item><span class="badge bg-danger">First Name</span></div>
            </div>
            <div class="flexRow selection">
              <mat-radio-button [value]="'lastName'"></mat-radio-button>
              <div mat-menu-item><span class="badge bg-danger">Last Name</span></div>
            </div>
            <div class="flexRow selection">
              <mat-radio-button [value]="'businessName'"></mat-radio-button>
              <div mat-menu-item><span class="badge bg-danger">Business Name</span></div>
            </div>
          </mat-radio-group>
        </mat-menu>
        <button mat-raised-button color="primary" (click)="openModal()">Add New</button>
      </div>
      <mat-list>
        <mat-list-item *ngFor="let contact of filteredList" class="pointer" (click)="contactClicked(contact)">
          {{contact.businessName}}{{contact.firstName}} {{contact.lastName}}
            <span class="badge bg-danger" *ngIf="contact.userId != undefined">User</span>
            <span class="badge bg-primary" *ngIf="contact.employeeId != undefined">Employee</span>
            <span class="badge bg-warning" *ngIf="contact.freelancerId != undefined">Freelancer</span>
            <span class="badge bg-success" *ngIf="contact.customerId != undefined">Customer</span>
        </mat-list-item>
      </mat-list>
    </div>
  </div>
  <div class="info flexColumn">
    <div class="details">
        <app-view-contact *ngIf="contact != undefined" [contact]="contact"></app-view-contact>
    </div>
    <div class="log">
      <div class="">Contact Log</div>
    </div>
  </div>

</div>
