<div class="flexContainer">
  <h1>Import New Inventory</h1>
  <div class="importContainer">
    <mat-card>
      <mat-card-header>
        <mat-card-title></mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <form>
          <input #csvInput hidden="true" type="file" onclick="this.value=null" (change)="csvInputChange($event)" accept=".csv"/>
          <button mat-flat-button color="primary" (click)="csvInput.click()">Select CSV</button>
        </form>
      </mat-card-content>
      <mat-card-footer>
        <mat-card-actions>
          <button mat-raised-button color="primary">Upload</button>
        </mat-card-actions>
      </mat-card-footer>
    </mat-card>
  </div>
</div>
